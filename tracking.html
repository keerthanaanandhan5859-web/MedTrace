<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Track Waste | MedTrace AMR</title>
<link rel="stylesheet" href="style.css"><link rel="icon" type="image/png" href="./MedTrace.png">
</head>
<body>
<header class="top"><a class="brand" href="index.html"><img src="MedTrace.png" alt="MedTrace">MEDTRACE <span>AMR</span></a><a href="login.html" style="color:#c6d8e4;font-weight:700">Login</a></header>
<main class="container" style="padding:45px 0">
<section class="card">
  <div class="page-head"><div><h1>Track a Waste Bag</h1><p class="muted">Enter the Waste ID printed beside the QR code.</p></div><span class="badge info">PUBLIC TRACEABILITY</span></div>
  <div style="display:flex;gap:10px;max-width:700px"><input id="id" class="input" placeholder="MT-2026-12345"><button id="trackBtn" class="btn primary">Track →</button></div>
  <p id="msg" class="muted small"></p>
</section>
<section id="result" class="card" style="display:none;margin-top:18px">
  <div class="page-head"><div><h2 id="title"></h2><p id="summary" class="muted"></p></div><span id="status" class="badge"></span></div>
  <div class="mini-grid">
    <div class="card" style="box-shadow:none"><div class="small muted">Hospital / Origin</div><b id="hospital">—</b></div>
    <div class="card" style="box-shadow:none"><div class="small muted">Waste Type</div><b id="type">—</b></div>
    <div class="card" style="box-shadow:none"><div class="small muted">Weight</div><b id="weight">—</b></div>
    <div class="card" style="box-shadow:none"><div class="small muted">Compartment</div><b id="comp">—</b></div>
  </div>
  <div class="split" style="margin-top:18px">
    <div><h3>Chain of Custody</h3><div id="timeline" class="timeline"></div></div>
    <div><h3>Location</h3><div class="map-box"><div class="map-grid"></div><div class="map-label a">Hospital</div><div class="map-label b">Collection route</div><div class="map-label c">CBWTF</div><div class="map-label d">Treatment</div><div id="dot" class="robot-dot"></div></div><p id="gps" class="small muted"></p></div>
  </div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);const params=new URLSearchParams(location.search);if(params.get('id'))$('id').value=params.get('id');
$('trackBtn').onclick=track;
async function track(){
 try{
  const id=$('id').value.trim();if(!id)throw Error('Enter a Waste ID.');
  const r=await fetch('/api/waste/'+encodeURIComponent(id)+'/timeline');const w=await r.json();if(!r.ok)throw Error(w.message||'Waste ID not found');
  $('result').style.display='block';$('title').textContent=w.wasteId;$('summary').textContent='Digital chain-of-custody record';
  $('status').textContent=w.currentStatus.replaceAll('_',' ');$('status').className='badge '+(w.currentStatus==='TREATMENT_COMPLETED'?'ok':'info');
  $('hospital').textContent=w.origin?'Registered facility':'—';
  $('type').textContent=w.ai?.detectedCategory||'Pending verification';
  $('weight').textContent='See registered record';
  $('comp').textContent=w.ai?.compartment||'Pending';
  $('timeline').innerHTML=(w.events||[]).map(e=>`<div class="event"><b>${e.status.replaceAll('_',' ')}</b><br><span class="muted">${new Date(e.timestamp).toLocaleString()} • ${e.actorName||'System'}</span>${e.note?'<br><span class="small">'+e.note+'</span>':''}${e.latitude!=null?'<br><span class="small muted">GPS: '+Number(e.latitude).toFixed(5)+', '+Number(e.longitude).toFixed(5)+'</span>':''}</div>`).join('');
  const g=w.origin;
  $('gps').textContent=g?.latitude!=null?`Origin GPS: ${Number(g.latitude).toFixed(6)}, ${Number(g.longitude).toFixed(6)} ±${Math.round(g.accuracy||0)}m`:'Origin GPS not available';
 }catch(e){$('msg').textContent=e.message;$('result').style.display='none'}
}
if(params.get('id'))track();
</script>
</body></html>
